# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "duck-kitchen-quest"

[setup]
script = '''
#!/usr/bin/env bash
# DeliciousDuck.com — Codex environment bootstrap
# Run from the repository root. Safe to run more than once.

set -Eeuo pipefail

log() {
  printf '\n[DeliciousDuck setup] %s\n' "$1"
}

fail() {
  printf '\n[DeliciousDuck setup] ERROR: %s\n' "$1" >&2
  exit 1
}

command -v git >/dev/null 2>&1 || fail "git is required"
command -v node >/dev/null 2>&1 || fail "Node.js is required"
command -v npm >/dev/null 2>&1 || fail "npm is required"

[[ -f package.json ]] || fail "package.json was not found. Run this script from the DeliciousDuck repository root."

log "Repository: $(basename "$(pwd)")"
log "Node: $(node --version); npm: $(npm --version)"

# Do not install from an ambiguous dependency state or rewrite the lockfile.
if [[ -f package-lock.json ]]; then
  log "Installing exact npm dependencies from package-lock.json"
  npm ci --no-audit --no-fund
elif [[ -f npm-shrinkwrap.json ]]; then
  log "Installing exact npm dependencies from npm-shrinkwrap.json"
  npm ci --no-audit --no-fund
else
  fail "No npm lockfile found. Commit package-lock.json before using Codex so installs remain reproducible."
fi

# Install Playwright's Chromium only when the project actually declares Playwright.
# Failure here is non-fatal because some Codex images already provide a browser.
if node -e 'const p=require("./package.json"); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.exit(d["@playwright/test"]||d.playwright?0:1)' 2>/dev/null; then
  log "Playwright detected; ensuring Chromium is available"
  npx playwright install chromium || log "Chromium installation skipped; Codex may use its preinstalled browser"
fi

# Report configuration names only. Never print values or secrets.
if [[ -f .env.example ]]; then
  log "Environment variables declared by .env.example"
  sed -E '/^[[:space:]]*(#|$)/d; s/[[:space:]]*=.*$//' .env.example | sort -u
else
  log "No .env.example found; no environment values were created or changed"
fi

log "Running the production build as the setup health check"
npm run build

log "Setup complete. Use: npm run dev -- --host 0.0.0.0"'''
