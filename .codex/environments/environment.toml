# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "duck-kitchen-quest"

[setup]
script = '''
#!/usr/bin/env bash
# DeliciousDuck.com — Codex environment bootstrap
# Run from the repository root. Safe to run more than once.

set -Eeuo pipefail

log() {
  printf '\n[DeliciousDuck setup] %s\n' "$1"
}

fail() {
  printf '\n[DeliciousDuck setup] ERROR: %s\n' "$1" >&2
  exit 1
}

command -v git >/dev/null 2>&1 || fail "git is required"
command -v node >/dev/null 2>&1 || fail "Node.js is required"
[[ -f package.json ]] || fail "package.json was not found. Run this script from the DeliciousDuck repository root."
[[ -f bun.lock ]] || fail "bun.lock was not found. This repository is Bun-managed; do not substitute npm install."

# Install Bun only when the environment does not already provide it.
if ! command -v bun >/dev/null 2>&1; then
  command -v curl >/dev/null 2>&1 || fail "Bun is missing and curl is unavailable for bootstrap installation"
  log "Bun not found; installing Bun for this Codex environment"
  curl -fsSL https://bun.sh/install | bash
  export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
  export PATH="$BUN_INSTALL/bin:$PATH"
fi
command -v bun >/dev/null 2>&1 || fail "Bun installation did not place bun on PATH"

log "Repository: $(basename "$(pwd)")"
log "Node: $(node --version); Bun: $(bun --version)"

# Respect the committed Bun lockfile without rewriting dependency resolution.
log "Installing exact dependencies from bun.lock"
bun install --frozen-lockfile

# Media tools are required for the Creative Studio sprint. In generic Codex
# environments we report a precise blocker rather than silently using a private
# Playwright ffmpeg binary or an incomplete substitute.
if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
  log "FFmpeg: $(ffmpeg -version | head -n 1)"
  log "ffprobe: available"
else
  log "FFmpeg/ffprobe not both available. Creative Studio video rendering must install a full FFmpeg distribution before render work."
fi

# Install Playwright Chromium only when the current package actually declares it.
if node -e 'const p=require("./package.json"); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.exit(d["@playwright/test"]||d.playwright?0:1)' 2>/dev/null; then
  log "Playwright detected; ensuring Chromium is available"
  bunx playwright install chromium || log "Chromium installation skipped; Codex may use an existing browser installation"
fi

# Report configuration names only. Never print values or secrets.
if [[ -f .env.example ]]; then
  log "Environment variables declared by .env.example"
  sed -E '/^[[:space:]]*(#|$)/d; s/[[:space:]]*=.*$//' .env.example | sort -u
else
  log "No .env.example found; no environment values were created or changed"
fi

log "Running the production build as the setup health check"
bun run build

log "Setup complete. Use: bun run dev -- --host 0.0.0.0"'''
