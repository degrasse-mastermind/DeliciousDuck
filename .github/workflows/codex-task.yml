name: Codex task bridge

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Stable task ID (for example DD-2026-001)
        required: true
        type: string
      business_role:
        description: Accountable business role
        required: true
        type: choice
        options: [coo, cmo, growth-marketer, content-creator, product-manager, cto, cfo]
      work_mode:
        description: Delivery mode
        required: true
        type: choice
        options: [plan, implement, review, qa]
      approved_revision:
        description: Exact approved task-contract revision
        required: true
        type: string
      approved_by:
        description: Owner identity recorded on the approved contract
        required: true
        type: string
      approved_at:
        description: Approval timestamp recorded on the approved contract
        required: true
        type: string
      task_contract:
        description: Complete approved task contract as JSON
        required: true
        type: string
      owner_approved:
        description: I approve dispatch of this exact task contract
        required: true
        default: false
        type: boolean
      callback_approved:
        description: I separately approve returning this task result to the Workspace Agent
        required: true
        default: false
        type: boolean
      issue_number:
        description: GitHub issue number bound to the approved task contract
        required: true
        type: string
      conversation_key:
        description: Stable conversation key bound to the contract; does not authorize callback
        required: true
        type: string
  repository_dispatch:
    types: [codex-task]

permissions:
  contents: read

concurrency:
  group: codex-task-${{ github.event.client_payload.task_id || inputs.task_id || github.run_id }}
  cancel-in-progress: false

jobs:
  codex:
    name: run-${{ github.event.client_payload.business_role || inputs.business_role }}-${{ github.event.client_payload.work_mode || inputs.work_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      final-message: ${{ steps.run-codex.outputs.final-message }}
      has-changes: ${{ steps.capture.outputs.has-changes }}
      business-role: ${{ steps.prepare.outputs.business-role }}
      work-mode: ${{ steps.prepare.outputs.work-mode }}
      task-id: ${{ steps.prepare.outputs.task-id }}
      task-revision: ${{ steps.prepare.outputs.task-revision }}
      issue-number: ${{ steps.prepare.outputs.issue-number }}
      conversation-key: ${{ steps.prepare.outputs.conversation-key }}
      callback-approved: ${{ steps.prepare.outputs.callback-approved }}
      callback-idempotency-key: ${{ steps.prepare.outputs.callback-idempotency-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare approved task prompt
        id: prepare
        env:
          BUSINESS_ROLE: ${{ github.event.client_payload.business_role || inputs.business_role }}
          WORK_MODE: ${{ github.event.client_payload.work_mode || inputs.work_mode }}
          TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
          APPROVED_REVISION: ${{ github.event.client_payload.approved_revision || inputs.approved_revision }}
          APPROVED_BY: ${{ github.event.client_payload.approved_by || inputs.approved_by }}
          APPROVED_AT: ${{ github.event.client_payload.approved_at || inputs.approved_at }}
          TASK_CONTRACT: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.task_contract) || inputs.task_contract }}
          OWNER_APPROVED: ${{ github.event.client_payload.owner_approved || inputs.owner_approved }}
          CALLBACK_APPROVED: ${{ github.event.client_payload.callback_approved || inputs.callback_approved }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
          CONVERSATION_KEY: ${{ github.event.client_payload.conversation_key || inputs.conversation_key }}
          PROMPT_OUTPUT: ${{ runner.temp }}/codex-prompt.md
        run: node plugins/methodnorth-agent-operations/scripts/prepare-task.mjs

      - name: Run Codex
        id: run-codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex-output.md
          sandbox: ${{ steps.prepare.outputs.work-mode == 'implement' && 'workspace-write' || 'read-only' }}
          effort: high
          safety-strategy: drop-sudo
          allow-users: degrasse-mastermind

      - name: Capture implementation patch
        id: capture
        if: steps.prepare.outputs.work-mode == 'implement'
        shell: bash
        run: |
          git diff --binary -- . > "$RUNNER_TEMP/codex.patch"
          if [[ -s "$RUNNER_TEMP/codex.patch" ]]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload implementation patch
        if: steps.capture.outputs.has-changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex.patch
          if-no-files-found: error
          retention-days: 7

  publish-changes:
    name: open-implementation-pr
    needs: codex
    if: needs.codex.outputs.work-mode == 'implement' && needs.codex.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request-url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download implementation patch
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codex-patch-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Apply, commit, and push review branch
        id: branch
        shell: bash
        run: |
          branch="codex/${{ needs.codex.outputs.task-id }}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git apply --index --3way "$RUNNER_TEMP/codex.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply ${{ needs.codex.outputs.task-id }}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          url="$(gh pr create --base main --head "$BRANCH" --title "${{ needs.codex.outputs.task-id }}: Codex implementation" --body "Approved agent implementation from workflow run $GITHUB_RUN_ID. Business role: ${{ needs.codex.outputs.business-role }}. Review and merge only after CI and human review.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  report:
    name: report-result
    needs: [codex, publish-changes]
    if: always() && needs.codex.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out callback helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build task result
        shell: bash
        env:
          BUSINESS_ROLE: ${{ needs.codex.outputs.business-role }}
          WORK_MODE: ${{ needs.codex.outputs.work-mode }}
          TASK_ID: ${{ needs.codex.outputs.task-id }}
          FINAL_MESSAGE: ${{ needs.codex.outputs.final-message }}
          PR_URL: ${{ needs.publish-changes.outputs.pull-request-url }}
          CODEX_RESULT: ${{ needs.codex.result }}
        run: |
          {
            printf '## %s · %s · %s\n\n' "${TASK_ID:-unknown-task}" "${BUSINESS_ROLE:-unknown-role}" "${WORK_MODE:-unknown-mode}"
            printf 'Codex task status: **%s**\n\n' "$CODEX_RESULT"
            if [[ -n "$PR_URL" ]]; then printf 'Implementation PR: %s\n\n' "$PR_URL"; fi
            printf '%s\n' "${FINAL_MESSAGE:-No final message was produced. Inspect the workflow logs.}"
          } > "$RUNNER_TEMP/result.md"

      - name: Return result to ChatGPT Workspace Agent
        id: callback
        if: needs.codex.outputs.callback-approved == 'true'
        continue-on-error: true
        env:
          CHATGPT_AGENT_ACCESS_TOKEN: ${{ secrets.CHATGPT_AGENT_ACCESS_TOKEN }}
          CHATGPT_AGENT_ID: ${{ vars.CHATGPT_AGENT_ID }}
          CONVERSATION_KEY: ${{ needs.codex.outputs.conversation-key }}
          CALLBACK_INPUT_FILE: ${{ runner.temp }}/result.md
          IDEMPOTENCY_KEY: ${{ needs.codex.outputs.callback-idempotency-key }}
        run: node plugins/methodnorth-agent-operations/scripts/return-workspace-agent-result.mjs

      - name: Reconcile final result
        id: reconcile
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/result.md
          CODEX_RESULT: ${{ needs.codex.result }}
          WORK_MODE: ${{ needs.codex.outputs.work-mode }}
          HAS_CHANGES: ${{ needs.codex.outputs.has-changes }}
          PUBLISH_RESULT: ${{ needs.publish-changes.result }}
          PR_URL: ${{ needs.publish-changes.outputs.pull-request-url }}
          CALLBACK_APPROVED: ${{ needs.codex.outputs.callback-approved }}
          CALLBACK_STATUS: ${{ steps.callback.outputs.callback-status }}
          CALLBACK_DETAIL: ${{ steps.callback.outputs.callback-detail }}
        run: node plugins/methodnorth-agent-operations/scripts/reconcile-agent-result.mjs

      - name: Comment final result on linked issue
        if: needs.codex.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.codex.outputs.issue-number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"

      - name: Fail when the reconciled task did not complete
        if: always() && steps.reconcile.outputs.overall-status != 'completed'
        run: exit 1
