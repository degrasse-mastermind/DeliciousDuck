name: Codex task
description: Define a scoped, evidence-backed task for a DeliciousDuck agent role.
title: "[Task] "
labels: [agent:triage]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Stable identifier in DD-YYYY-NNN format.
      placeholder: DD-2026-001
    validations:
      required: true
  - type: dropdown
    id: business_role
    attributes:
      label: Accountable business role
      options:
        - coo
        - cmo
        - growth-marketer
        - content-creator
        - product-manager
        - cto
        - cfo
    validations:
      required: true
  - type: dropdown
    id: work_mode
    attributes:
      label: Delivery mode
      options:
        - plan
        - implement
        - review
        - qa
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not just the activity.
      placeholder: What should be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Include files, systems, publication boundaries, and actions that are not authorized.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: One verifiable criterion per line.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and handoffs
      description: List predecessor tasks, supporting roles, and the role that receives the result.
  - type: checkboxes
    id: approval
    attributes:
      label: Owner approval
      description: Approval is required before this issue is dispatched to an agent.
      options:
        - label: I approve dispatch of this exact task contract.
          required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source context
      description: Link plans, screenshots, prior decisions, or production evidence. Do not paste secrets.
